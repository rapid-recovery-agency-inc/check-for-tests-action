name: Auto-label PR on Changes Requested


on:
  pull_request_review:
    types: [submitted]


jobs:
  label-pr:
    runs-on: ubuntu-latest

    if: github.event.review.state == 'changes_requested'

    steps:
      - name: Check if reviewer is QA team member
        id: check_qa
        run: |
          QA_MEMBERS=("Juan" "Anjelys" "Augusto" "Enzo" "Nicolas")
          REVIEWER="${{ github.event.review.user.login }}"

          IS_QA="false"
          for member in "${QA_MEMBERS[@]}"; do
            if [[ "$REVIEWER" == "$member" ]]; then
              IS_QA="true"
              break
            fi
          done

          echo "is_qa=$IS_QA" >> $GITHUB_OUTPUT
          echo "Reviewer: $REVIEWER, Is QA: $IS_QA"

      - name: Add label if not QA reviewer
        if: steps.check_qa.outputs.is_qa == 'false'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const labels = ['dev-changes-requested'];


            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              labels: labels
            });

            console.log(`Label '${labels[0]}' added to PR #${context.payload.pull_request.number}`);

      - name: Remove label when approved
        if: github.event.review.state == 'approved'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.removeLabel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              name: 'dev-changes-requested'
            });
            console.log(`Label 'dev-changes-requested' removed from PR #${context.payload.pull_request.number}`);



####### se se hara custome 
name: 'PR Dev Review Labeler'
description: 'Automatically labels PRs when dev reviewers request changes, excluding QA team members'
author: 'Your Name/Organization'

branding:
  icon: 'tag'
  color: 'orange'

inputs:
  github-token:
    description: 'GitHub token for API requests'
    required: true
    default: ${{ github.token }}
  
  label-name:
    description: 'Label to apply when changes are requested'
    required: false
    default: 'dev-changes-requested'
  
  qa-team-members:
    description: 'Comma-separated list of QA team member GitHub usernames'
    required: true
    # Example: 'juan-gh,anjelys-qa,augusto123,enzo-m,nicolas-dev'

runs:
  using: 'composite'
  steps:
    - name: Check if reviewer is QA team member
      id: check_qa
      shell: bash
      run: |
        # Convertir la lista separada por comas en un array
        IFS=',' read -ra QA_MEMBERS <<< "${{ inputs.qa-team-members }}"
        REVIEWER="${{ github.event.review.user.login }}"
        
        IS_QA="false"
        for member in "${QA_MEMBERS[@]}"; do
          # Trim whitespace
          member=$(echo "$member" | xargs)
          if [[ "$REVIEWER" == "$member" ]]; then
            IS_QA="true"
            echo "✓ Reviewer $REVIEWER is a QA team member - skipping label"
            break
          fi
        done
        
        echo "is_qa=$IS_QA" >> $GITHUB_OUTPUT
        echo "reviewer=$REVIEWER" >> $GITHUB_OUTPUT
        
        if [[ "$IS_QA" == "false" ]]; then
          echo "→ Reviewer $REVIEWER is a dev - will apply label"
        fi

    - name: Add label if not QA reviewer
      if: steps.check_qa.outputs.is_qa == 'false' && github.event.review.state == 'changes_requested'
      uses: actions/github-script@v7
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const labelName = '${{ inputs.label-name }}';
          
          try {
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              labels: [labelName]
            });
            
            console.log(`✓ Label '${labelName}' added to PR #${context.payload.pull_request.number}`);
            console.log(`  Reviewer: ${{ steps.check_qa.outputs.reviewer }}`);
          } catch (error) {
            console.error(`✗ Failed to add label: ${error.message}`);
            throw error;
          }

    - name: Remove label when approved
      if: github.event.review.state == 'approved'
      uses: actions/github-script@v7
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const labelName = '${{ inputs.label-name }}';
          
          try {
            await github.rest.issues.removeLabel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              name: labelName
            });
            console.log(`✓ Label '${labelName}' removed from PR #${context.payload.pull_request.number}`);
          } catch (error) {
            // Ignorar si la etiqueta no existe (404)
            if (error.status === 404) {
              console.log(`ℹ Label '${labelName}' was not present on PR`);
            } else {
              console.error(`✗ Failed to remove label: ${error.message}`);
              throw error;
            }
          }
